name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a Release after all builds succeed
        type: boolean
        default: true
      version:
        description: Release tag (e.g. v0.1 or v0.2-beta.1)
        type: string
        default: v0.1

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ inputs.publish_release && inputs.version || 'build' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.event_name != 'workflow_dispatch' }}

jobs:
  prepare:
    name: Validate version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Resolve build and release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          MANUAL_PUBLISH: ${{ inputs.publish_release }}
          MANUAL_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          publish=false
          version="dev-${GITHUB_SHA:0:8}"
          if [[ "$EVENT_NAME" == push && "$REF_TYPE" == tag ]]; then
            publish=true
            version=$REF_NAME
          elif [[ "$EVENT_NAME" == workflow_dispatch && "$MANUAL_PUBLISH" == true ]]; then
            publish=true
            version=$MANUAL_VERSION
          fi
          if [[ "$publish" == true && ! "$version" =~ ^v[0-9][A-Za-z0-9._+-]{0,78}$ ]]; then
            echo 'Release version must start with v and a digit and use only letters, digits, dot, underscore, plus or hyphen (max 80 characters).' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  desktop:
    name: ${{ matrix.target }}-${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            arch: amd64
            runner: ubuntu-24.04
          - target: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - target: windows
            arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    container: golang:1.26-bookworm
    timeout-minutes: 60
    env:
      CGO_ENABLED: '1'
      GOFLAGS: -mod=readonly
      GOPROXY: https://goproxy.cn|direct
      RMIC_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure build
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Prepare compiler and audio dependencies
        run: bash .ci/setup.sh '${{ matrix.target }}'
      - name: Prepare GUI dependencies
        run: bash .ci/setup-gui.sh '${{ matrix.target }}'
      - name: Native audio and race tests
        if: matrix.target == 'linux'
        run: bash .ci/check.sh
      - name: GUI checks
        if: matrix.target == 'linux'
        run: bash .ci/check-gui.sh
      - name: Package TUI
        run: bash .ci/package.sh '${{ matrix.target }}' '${{ matrix.arch }}' tui
      - name: Package GUI
        run: bash .ci/package.sh '${{ matrix.target }}' '${{ matrix.arch }}' gui
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android
    needs: prepare
    runs-on: ubuntu-24.04
    container: golang:1.26-bookworm
    timeout-minutes: 45
    env:
      ANDROID_HOME: /opt/android-sdk
      RMIC_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure build
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Prepare Java and Android SDK
        run: bash .ci/setup-android.sh
      - name: Test, lint and package (PR)
        if: github.event_name == 'pull_request'
        run: bash .ci/package-android.sh all
      - name: Test, lint and package
        if: github.event_name != 'pull_request'
        env:
          RMIC_ANDROID_KEYSTORE_BASE64: ${{ secrets.RMIC_ANDROID_KEYSTORE_BASE64 }}
          RMIC_ANDROID_STORE_PASSWORD: ${{ secrets.RMIC_ANDROID_STORE_PASSWORD }}
          RMIC_ANDROID_KEY_ALIAS: ${{ secrets.RMIC_ANDROID_KEY_ALIAS }}
          RMIC_ANDROID_KEY_PASSWORD: ${{ secrets.RMIC_ANDROID_KEY_PASSWORD }}
        run: bash .ci/package-android.sh all
      - uses: actions/upload-artifact@v4
        with:
          name: packages-android
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, desktop, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Verify checksums
        working-directory: dist
        run: |
          shopt -s nullglob
          checksums=(*.sha256)
          (( ${#checksums[@]} > 0 ))
          sha256sum -c "${checksums[@]}"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Create a missing manual tag only after all builds succeed.
          tag_sha=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" \
            --jq '.[] | select(.ref == "refs/tags/" + env.RELEASE_TAG) | .object.sha')
          if [[ -z "$tag_sha" ]]; then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_COMMIT" >/dev/null
          fi
          resolved_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          if [[ "$resolved_commit" != "$RELEASE_COMMIT" ]]; then
            echo "Tag $RELEASE_TAG points to another commit; run on that tag or use a new version." >&2
            exit 1
          fi
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
          # Upload to a draft first; failed uploads never publish a partial release.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            [[ $(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft) == true ]] || {
              echo 'Release already published; use a new version tag.' >&2
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft "${prerelease[@]}" \
              --title "RMic $RELEASE_TAG" \
              --notes 'Windows/Linux provide separate GUI and TUI packages. Windows includes only the unchanged base VB-CABLE ZIP for manual installation. Android APKs marked release-unsigned require signing; debug builds are for testing. SHA-256 files accompany all packages. See README for setup and platform validation limits.'
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${prerelease[@]}"
